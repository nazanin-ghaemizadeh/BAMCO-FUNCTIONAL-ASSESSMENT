<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 464 332" role="img" aria-labelledby="car-inspection-title car-inspection-desc">
  <title id="car-inspection-title">خودروی کوچک در حال ارزیابی</title>
  <desc id="car-inspection-desc">خودروی نعنایی خندان در نمای سه‌ربع، کنار یک برگهٔ بازرسی با علامت تأیید.</desc>

  <ellipse cx="226" cy="268" rx="157" ry="14" fill="#4b8d7b" opacity=".09"/>
  <ellipse cx="231" cy="269" rx="118" ry="8" fill="#4b8d7b" opacity=".07"/>

