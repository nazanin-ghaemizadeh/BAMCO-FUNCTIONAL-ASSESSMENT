    <path d="M206 109q15-8 37-9" fill="none" stroke="#6aab9d" stroke-width="3"/>
    <path d="m150 111-4 23m18-22-5 30m72-32-10 31m28-32-7 20" fill="none" stroke="#fff" stroke-width="4.5" opacity=".9"/>
