<section id="portalGate" aria-labelledby="portalMotto">
  <h1 id="portalMotto" class="welcome-title"><span data-pt="motto1">کیفیت از</span> <em data-pt="motto2">ارزیابی دقیق</em> <span data-pt="motto3">آغاز می‌شود.</span></h1>
  <div class="welcome-divider" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="portal-login-card">
    <div class="portal-form-side">
      <h2 data-pt="signIn">ورود به سامانه</h2>
      <form id="portalLogin">
        <label for="portalEmail" data-pt="username">نام کاربری</label>
        <input id="portalEmail" type="text" autocapitalize="none" spellcheck="false" dir="ltr" autocomplete="username" required maxlength="254">
        <label for="portalPassword" data-pt="password">رمز عبور</label>
        <div class="portal-password"><input id="portalPassword" type="password" dir="ltr" autocomplete="current-password" required><button type="button" id="portalReveal" aria-label="نمایش رمز عبور" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div>
        <label id="portalTrust" class="portal-trust" hidden><input id="portalRemember" type="checkbox"><span data-pt="remember">این دستگاه را به خاطر بسپار</span></label>
        <p id="portalNotice" class="portal-notice" role="status"></p>
        <button type="submit" class="portal-primary" data-pt="signIn">ورود به سامانه</button>
      </form>
    </div>
    <div class="portal-art"><img src="./assets/car-inspection.svg" width="464" height="332" alt="خودروی خندان در حال ارزیابی" id="portalCar"></div>
  </div>
</section>
<dialog id="portalDialog" aria-labelledby="portalDialogTitle">
  <div class="portal-dialog-head">
    <div class="portal-heading">
      <svg class="portal-head-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="10" cy="8.5" r="3"/><path d="M4.5 18.5v-1A4.5 4.5 0 0 1 9 13h2a4.5 4.5 0 0 1 4.5 4.5v1M16 6.3a2.6 2.6 0 0 1 0 4.8M17 13.4a4 4 0 0 1 3 3.9"/>
      </svg>
      <h2 id="portalDialogTitle"></h2>
    </div>
    <button id="portalClose" type="button" aria-label="بستن">×</button>
  </div>
  <div id="portalDialogBody"></div>
</dialog>
